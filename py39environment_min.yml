# Minimal py39 env: only the third-party libs imported in s1-s3 (tensorflow removed).
# Full snapshot of the original env: s3/py39environment.yml
# Create with: conda env create -f py39environment_min.yml
name: py39
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      # Core numerics / plotting
      - numpy==1.26.4
      - scipy==1.13.1
      - matplotlib==3.9.1
      - plotly==5.23.0
      - pandas==2.3.1
      - scikit-learn==1.5.1
      - scikit-image==0.24.0
      - sympy==1.13.1
      # Images / vision
      - opencv-python==4.10.0.84
      - imageio==2.33.1
      - pillow==10.4.0
      - pycolmap==3.11.1
      # 3D / point clouds / meshes
      - open3d==0.18.0
      - trimesh==4.4.3
      - shapely==2.0.7
      - vtk==9.3.1
      - vedo==2024.5.2
      # Datasets / ROS bags
      - pykitti==0.3.1
      - rosbags==0.9.23
      - mcap-ros2-support==0.5.5
      - pyyaml==6.0.2
      # Notebooks
      - jupyterlab==4.2.7
      - ipykernel==6.29.5
      # ipyvtklink omitted: needs ipywidgets<8, which conflicts with open3d 0.18
